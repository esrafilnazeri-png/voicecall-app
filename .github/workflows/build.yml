name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check uploaded app-ui.kt
        run: |
          if [ ! -f app-ui.kt ]; then
            echo "::error::فایل app-ui.kt در ریشه ریپو پیدا نشد — اول اون رو آپلود کن"
            exit 1
          fi
          if ! grep -q "END_OF_ESYCALL_UI" app-ui.kt; then
            echo "::error::فایل app-ui.kt ناقص آپلود شده (paste بریده شده) — دوباره کامل paste کن"
            exit 1
          fi
          VER=$(grep -o "نسخه [۰-۹]*" app-ui.kt | head -1)
          LINES=$(wc -l < app-ui.kt)
          echo "VERSION=$VER LINES=$LINES"
          echo "## نسخه بیلد شده: $VER ($LINES خط)" >> "$GITHUB_STEP_SUMMARY"

      - name: Unzip project
        run: unzip -o app.zip -d project

      - name: Put new UI + fix import
        run: |
          cp app-ui.kt project/app/src/main/java/com/esrafil/voicecall/MainActivity.kt
          sed -i '/^package /a import io.livekit.android.events.collect' project/app/src/main/java/com/esrafil/voicecall/CallManager.kt

      - name: Icon + label + permissions
        run: |
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.VIBRATE" />|' project/app/src/main/AndroidManifest.xml
          ICON=""
          if [ -f esycall-icon.png ]; then ICON=esycall-icon.png; fi
          if [ -f icon.png ]; then ICON=icon.png; fi
          if [ -n "$ICON" ]; then
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p "project/app/src/main/res/mipmap-$d"
              cp "$ICON" "project/app/src/main/res/mipmap-$d/ic_launcher.png"
              cp "$ICON" "project/app/src/main/res/mipmap-$d/ic_launcher_round.png"
            done
            sed -i 's|android:icon="@android:drawable/sym_action_call"|android:icon="@mipmap/ic_launcher"|' project/app/src/main/AndroidManifest.xml
            echo "ICON APPLIED: $ICON"
          fi
          sed -i 's|android:label="[^"]*"|android:label="esy call"|' project/app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: esy-call-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
