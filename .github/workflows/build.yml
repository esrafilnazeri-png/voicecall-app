name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o app.zip -d project

      - name: Fix missing import
        run: sed -i '/^package /a import io.livekit.android.events.collect' project/app/src/main/java/com/esrafil/voicecall/CallManager.kt

      - name: Custom UI and icon
        run: |
          SRC=project/app/src/main/java/com/esrafil/voicecall/MainActivity.kt
          cp "$SRC" "$SRC.orig"
          UI=""
          if [ -f new-ui.kt ]; then UI=new-ui.kt; fi
          if [ -z "$UI" ]; then UI=$(ls *.kt 2>/dev/null | grep -i "new-ui" | head -1); fi
          if [ -z "$UI" ]; then UI=$(ls *.kt 2>/dev/null | grep -i "mainactivity" | head -1); fi
          if [ -n "$UI" ] && [ -f "$UI" ]; then
            cp "$UI" "$SRC"
            echo "CUSTOM UI APPLIED: $UI"
          else
            echo "UI FILE NOT FOUND IN REPO - keeping original"
          fi
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.VIBRATE" />|' project/app/src/main/AndroidManifest.xml
          ICON=""
          if [ -f esycall-icon.png ]; then ICON=esycall-icon.png; fi
          if [ -f icon.png ]; then ICON=icon.png; fi
          if [ -n "$ICON" ]; then
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p "project/app/src/main/res/mipmap-$d"
              cp "$ICON" "project/app/src/main/res/mipmap-$d/ic_launcher.png"
              cp "$ICON" "project/app/src/main/res/mipmap-$d/ic_launcher_round.png"
            done
            sed -i 's|android:icon="@android:drawable/sym_action_call"|android:icon="@mipmap/ic_launcher"|' project/app/src/main/AndroidManifest.xml
            echo "ICON APPLIED: $ICON"
          else
            echo "ICON NOT FOUND IN REPO"
          fi
          sed -i 's|android:label="[^"]*"|android:label="esy call"|' project/app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        working-directory: project
        run: |
          echo "=== BUILD ==="
          if ! gradle assembleDebug --no-daemon; then
            echo "CUSTOM UI BUILD FAILED - RETRYING WITH ORIGINAL UI"
            if [ -f app/src/main/java/com/esrafil/voicecall/MainActivity.kt.orig ]; then
              cp app/src/main/java/com/esrafil/voicecall/MainActivity.kt.orig app/src/main/java/com/esrafil/voicecall/MainActivity.kt
            fi
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
