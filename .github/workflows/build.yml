name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o app.zip -d project

      - name: Fix missing import
        run: sed -i '/^package /a import io.livekit.android.events.collect' project/app/src/main/java/com/esrafil/voicecall/CallManager.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        working-directory: project
        run: |
          echo "=== FILES ==="
          find app/src -type f | sort
          echo "=== GREP SERVER ==="
          grep -rn -i "server" app/src/main || true
          echo "=== MANIFEST ==="
          cat app/src/main/AndroidManifest.xml
          echo "=== GRADLE ==="
          cat app/build.gradle
          cat gradle/libs.versions.toml 2>/dev/null || true
          echo "=== VALUES ==="
          for f in app/src/main/res/values/*.xml; do echo "----- $f -----"; cat "$f"; done
          echo "=== LAYOUTS ==="
          for f in app/src/main/res/layout/*.xml; do echo "----- $f -----"; cat "$f"; done
          echo "=== CODE ==="
          for f in app/src/main/java/com/esrafil/voicecall/*.kt; do case "$f" in *CallManager.kt) ;; *) echo "----- $f -----"; cat "$f";; esac; done
          echo "=== BUILD ==="
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
